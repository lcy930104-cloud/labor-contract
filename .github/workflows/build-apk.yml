name: APK 만들기

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'docs/**', 'README.md' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: 서명 키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          OK=0
          if [ -n "$KEYSTORE_BASE64" ]; then
            # 붙여넣을 때 섞인 줄바꿈·공백은 무시하고 해독합니다
            if printf '%s' "$KEYSTORE_BASE64" | tr -d ' \n\r\t' | base64 -d > keystore/release.jks 2>/dev/null \
               && keytool -list -keystore keystore/release.jks -storepass "${KEYSTORE_PASSWORD:-samgang-contract}" >/dev/null 2>&1; then
              OK=1; echo "저장소 비밀값의 서명 키를 사용합니다."
            else
              echo "::warning::KEYSTORE_BASE64 비밀값을 해독하지 못했습니다 (release.jks.base64.txt 내용 전체를 그대로 붙여넣었는지, 비밀번호가 맞는지 확인). 이번 빌드는 임시 키로 서명합니다."
            fi
          fi
          if [ "$OK" != "1" ]; then
            rm -f keystore/release.jks
            keytool -genkeypair -keystore keystore/release.jks -storetype PKCS12 -alias contract -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass "${KEYSTORE_PASSWORD:-samgang-contract}" -keypass "${KEYSTORE_PASSWORD:-samgang-contract}" \
              -dname "CN=Labor Contract, O=Samgang, C=KR"
            [ -z "$KEYSTORE_BASE64" ] && echo "::warning::서명 키 비밀값(KEYSTORE_BASE64)이 없어 임시 키로 서명했습니다. 이 APK 로 기존 설치본을 업데이트하려면 먼저 삭제해야 합니다."
            true
          fi

      - name: APK 빌드
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: 파일 이름 정리
        run: cp app/build/outputs/apk/release/app-release.apk labor-contract.apk

      - name: APK 보관 (Actions 결과물)
        uses: actions/upload-artifact@v4
        with:
          name: 근로계약서-apk
          path: labor-contract.apk

      - name: 릴리스에 올리기 (다운로드 링크)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 근로계약서 앱 (최신 빌드 ${{ github.run_number }})
          body: 아래 labor-contract.apk 를 휴대폰에서 내려받아 설치하세요. 설치 시 "출처를 알 수 없는 앱" 허용이 필요합니다. 이 페이지는 새로 빌드될 때마다 갱신됩니다.
          files: labor-contract.apk
